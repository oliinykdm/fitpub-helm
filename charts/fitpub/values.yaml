# Default values for the fitpub chart.
# See README.md and docs/ for the longer explanations.

replicaCount: 1
revisionHistoryLimit: 3

# Only matters with the RollingUpdate strategy.
minReadySeconds: 0

# RWO PVC: old pod must release the volume before the new one mounts.
deploymentStrategy:
  type: Recreate

commonLabels: {}
#   environment: production
#   team: platform
commonAnnotations: {}
#   reloader.stakater.com/auto: "true"

# sleep infinity instead of the app - useful when you need to exec into a broken pod.
# helm upgrade ... --set diagnosticMode.enabled=true --reuse-values
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

image:
  repository: codeberg.org/fitpub/fitpub
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion when left empty.
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # FitPub does not call the API. No token needed.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # /tmp and /app/logs are mounted as emptyDir below. /app/uploads is the PVC.
  readOnlyRootFilesystem: true

# Writable emptyDir mounts so readOnlyRootFilesystem can stay on.
# tmp -> /tmp (OSM tile cache + image gen; config points FITPUB_TILE_CACHE_PATH
# and FITPUB_IMAGES_PATH here), logs -> logback file appender.
ephemeralVolumes:
  tmp:
    enabled: true
    sizeLimit: 1Gi
  logs:
    enabled: true
    sizeLimit: 512Mi
    mountPath: /app/logs

# Chowns the uploads PVC to the app user on first mount. Disabled by default:
# fsGroupChangePolicy: OnRootMismatch already handles this without root.
# Enable only for StorageClasses that ignore fsGroup (e.g. some NFS provisioners).
initContainers:
  volumePermissions:
    enabled: false
    image:
      repository: busybox
      tag: "1.37"
      pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fitpub.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  # The image runs Java 25 with -XX:MaxRAMPercentage=65 against the cgroup limit
  # (~2Gi heap at 3072Mi). Keep requests.memory close to limits.memory so the node
  # has room for heap plus metaspace/native overhead. The flag is hard-coded on the
  # java command line, so shrink the heap by lowering limits.memory, not with
  # JAVA_TOOL_OPTIONS. cpu limit caps GC/Flyway bursts.
  requests:
    cpu: 250m
    memory: 3072Mi
  limits:
    cpu: 1500m
    memory: 3072Mi

persistence:
  enabled: true
  # "" -> default StorageClass, "-" -> no class (pre-bound PV), "name" -> that class.
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  # Set helm.sh/resource-policy: keep here to survive `helm uninstall`.
  annotations: {}
  existingClaim: ""
  # Must match config.FITPUB_FILE_UPLOAD_DIR (chart validates this).
  mountPath: /app/uploads

# Static Markdown pages (terms.md, imprint.md, optional about.md) from a Secret.
pages:
  existingSecret: ""
  mountPath: /app/pages
  readOnly: true

# Non-secret env, rendered into a ConfigMap and loaded via envFrom. Only the keys
# the chart sets a non-default value for are listed here; the app reads many more
# (Hikari pool, ActivityPub inbox tuning, mail, feature toggles, log rotation) and
# applies its own defaults. Set any of those through `extraEnv` or by adding the
# key here - see application-prod.yml in the FitPub source for the full list.
config:
  # Database / JPA
  FITPUB_DATABASE_URL: ""
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.PostgreSQLDialect"

  # App
  SPRING_PROFILES_ACTIVE: "prod"
  FITPUB_PORT: "8080"
  FITPUB_DOMAIN: ""
  FITPUB_BASE_URL: ""

  # Browser CORS origins, comma-separated. Empty falls back to FITPUB_BASE_URL.
  FITPUB_CORS_ALLOWED_ORIGINS: ""

  # Comma-separated emails granted the instance admin role on startup.
  FITPUB_ADMIN_EMAILS: ""

  # Federation: http is for local testing only; allow-private-ips is an SSRF risk.
  FITPUB_FEDERATION_PROTOCOL: "https"
  FITPUB_ALLOW_PRIVATE_IPS: "false"

  # Flyway
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
  SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"

  # Web push: enable only with VAPID keys in applicationSecret and FITPUB_VAPID_SUBJECT set.
  FITPUB_PUSH_ENABLED: "false"

  # Uploads - standard Spring multipart limits, keep request >= file.
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "50MB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "50MB"
  # Was FILE_UPLOAD_DIR before 1.2.0. Must match persistence.mountPath (validated).
  FITPUB_FILE_UPLOAD_DIR: "/app/uploads"
  FITPUB_PAGES_PATH: "/app/pages"

  # The app defaults these to /app/images and /app/tiles, which are read-only under
  # readOnlyRootFilesystem. Redirect them to the writable /tmp emptyDir. Both are
  # regenerable caches, so ephemeral storage is fine.
  FITPUB_IMAGES_PATH: "/tmp/fitpub/images"
  FITPUB_TILE_CACHE_PATH: "/tmp/fitpub/tiles"

  FITPUB_REGISTRATION_ENABLED: "true"

  # Logging - root and app package are pinned to INFO, Hibernate to WARN. Drop a
  # key to fall back to the prod profile default.
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_NET_JAVAHIPPIE_FITPUB: "INFO"
  LOGGING_LEVEL_ORG_HIBERNATE: "WARN"

# Either point existingSecret at a pre-created Secret, or fill in data below.
applicationSecret:
  existingSecret: ""
  data:
    FITPUB_DATABASE_USERNAME: ""
    FITPUB_DATABASE_PASSWORD: ""
    FITPUB_JWT_SECRET: ""
    FITPUB_EMAIL_SECRET: ""
    # Protects the actuator endpoints (basic auth). The prod profile has no default,
    # so the pod will not start without it. Username defaults to "actuator", override
    # with config.FITPUB_ACTUATOR_USERNAME. Generate: openssl rand -base64 48
    FITPUB_ACTUATOR_PASSWORD: ""
    FITPUB_REGISTRATION_PASSWORD: ""
    FITPUB_VAPID_PUBLIC_KEY: ""
    FITPUB_VAPID_PRIVATE_KEY: ""
    FITPUB_MAIL_USERNAME: ""
    FITPUB_MAIL_PASSWORD: ""

# Override entrypoint/args only if you know why (e.g. custom JVM flags).
command: []
args: []

# preStop sleep gives kube-proxy time to remove the pod from iptables before
# SIGTERM is delivered, preventing in-flight requests from hitting a dying pod.
lifecycleHooks:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

extraEnv: []
extraEnvFrom: []
extraInitContainers: []
sidecars: []

# Fail at install time if required prod settings are missing. Off by default for helm lint/template.
productionChecks:
  enabled: false

# The actuator health groups are behind basic auth, so an httpGet probe gets 401.
# These exec probes reuse the image's wget to authenticate with the actuator
# credentials from the pod env, keeping the password out of the pod spec and working
# with applicationSecret.existingSecret. readiness follows Spring's readinessState
# (drops to 503 during the shutdown drain); liveness follows livenessState only, so a
# database outage does not restart pods. Neither re-checks the DB - see
# docs/troubleshooting.md to gate readiness on the DB instead.
readinessProbe:
  exec:
    command:
      - sh
      - -c
      - >-
        wget --spider -q
        --header="Authorization: Basic $(printf '%s:%s' "${FITPUB_ACTUATOR_USERNAME:-actuator}" "$FITPUB_ACTUATOR_PASSWORD" | base64 | tr -d '\n')"
        "http://127.0.0.1:${FITPUB_PORT:-8080}/actuator/health/readiness"
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  exec:
    command:
      - sh
      - -c
      - >-
        wget --spider -q
        --header="Authorization: Basic $(printf '%s:%s' "${FITPUB_ACTUATOR_USERNAME:-actuator}" "$FITPUB_ACTUATOR_PASSWORD" | base64 | tr -d '\n')"
        "http://127.0.0.1:${FITPUB_PORT:-8080}/actuator/health/readiness"
  # ~195s budget for startup (15 + 18*10) - Flyway + JVM on small nodes.
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 18

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - >-
        wget --spider -q
        --header="Authorization: Basic $(printf '%s:%s' "${FITPUB_ACTUATOR_USERNAME:-actuator}" "$FITPUB_ACTUATOR_PASSWORD" | base64 | tr -d '\n')"
        "http://127.0.0.1:${FITPUB_PORT:-8080}/actuator/health/liveness"
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# Scaling >1 needs persistence.accessMode=ReadWriteMany. RWO blocks it (chart enforces).
# Schedulers are concurrency-safe (DB row-claim + idempotent cleanups).
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: ""

podDisruptionBudget:
  enabled: true
  # maxUnavailable:1 lets node drains proceed at any replica count. minAvailable:1
  # would deadlock drains on a single replica (0 disruptions allowed). maxUnavailable wins if both set.
  minAvailable: ""
  maxUnavailable: 1

# Off by default: FitPub needs egress to PostGIS, SMTP and federated hosts.
# Do not set ingress.enabled=false without ingress.extraRules - that denies all
# inbound traffic when networkPolicy.enabled=true.
networkPolicy:
  enabled: false
  ingress:
    enabled: true
    # Sources allowed to reach the app port. Empty = any. Restrict in prod, e.g.
    #   from:
    #     - namespaceSelector:
    #         matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
    from: []
    extraRules: []
  egress:
    # allowAll suits federation (unpredictable remote hosts, OSM tiles, weather).
    # For a locked-down setup set allowAll: false and supply extraRules, e.g.
    #   allowAll: false
    #   extraRules:
    #     - to:                                   # DNS (kube-dns)
    #         - namespaceSelector:
    #             matchLabels: { kubernetes.io/metadata.name: kube-system }
    #       ports:
    #         - { protocol: UDP, port: 53 }
    #         - { protocol: TCP, port: 53 }
    #     - to:                                   # PostgreSQL/PostGIS
    #         - namespaceSelector:
    #             matchLabels: { kubernetes.io/metadata.name: database }
    #       ports:
    #         - { protocol: TCP, port: 5432 }
    #     - ports:                                # federation + SMTP submission
    #         - { protocol: TCP, port: 443 }
    #         - { protocol: TCP, port: 587 }
    allowAll: true
    extraRules: []

serviceMonitor:
  enabled: false
  labels: {}
  annotations: {}
  interval: 30s
  scrapeTimeout: 10s
  # /actuator/prometheus is behind basic auth, so scraping needs basicAuth below,
  # referencing a Secret in the ServiceMonitor namespace with the actuator username
  # (default "actuator") and FITPUB_ACTUATOR_PASSWORD.
  path: /actuator/prometheus
  scheme: http
  # Example - create the referenced Secret in the ServiceMonitor namespace:
  #   kubectl create secret generic fitpub-actuator-auth \
  #     --from-literal=username=actuator \
  #     --from-literal=password=<FITPUB_ACTUATOR_PASSWORD>
  # basicAuth:
  #   username:
  #     name: fitpub-actuator-auth
  #     key: username
  #   password:
  #     name: fitpub-actuator-auth
  #     key: password
  basicAuth: {}

terminationGracePeriodSeconds: 60

priorityClassName: ""
schedulerName: ""
runtimeClassName: ""

hostAliases: []
#   - ip: "192.168.1.10"
#     hostnames:
#       - "other-fitpub.internal"

# ClusterFirst | ClusterFirstWithHostNet | Default | None ("" = cluster default).
dnsPolicy: ""
dnsConfig: {}
#   nameservers:
#     - 1.1.1.1

nodeSelector: {}
tolerations: []
affinity: {}
# Zone/node spread for replicaCount > 1, e.g.
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: DoNotSchedule
#     labelSelector:
#       matchLabels: { app.kubernetes.io/name: fitpub }
topologySpreadConstraints: []
volumes: []
volumeMounts: []
