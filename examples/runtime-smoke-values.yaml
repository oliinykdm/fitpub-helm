# Values used by the runtime smoke-test workflow.
# This is intentionally not a production example.
#
# FITPUB_DATABASE_PASSWORD in the CI secret must match POSTGRES_PASSWORD in
# examples/postgis-dev.yaml (currently "fitpub").

productionChecks:
  enabled: true

config:
  FITPUB_DATABASE_URL: "jdbc:postgresql://postgis:5432/fitpub"
  FITPUB_DOMAIN: "fitpub.local"
  # HTTPS is required for any non-localhost origin as of FitPub 1.3.0.
  FITPUB_BASE_URL: "https://fitpub.local"
  FITPUB_FEDERATION_PROTOCOL: "http"
  FITPUB_PUSH_ENABLED: "false"

applicationSecret:
  existingSecret: "fitpub-secret"

ingress:
  enabled: false

persistence:
  enabled: false

podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 1536Mi
  limits:
    memory: 1536Mi

extraEnv:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=60"
